# Shadowrocket rules aligned with router policy, 2026-11-01.
# No nodes or credentials. PROXY uses the selected Shadowrocket node.
[General]
update-url = https://raw.githubusercontent.com/granden/home-network-rules/main/home-network.conf
dns-server = system

[Rule]
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/lan.conf,DIRECT,no-resolve
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT
RULE-SET,https://raw.githubusercontent.com/granden/home-network-rules/main/cn.list,DIRECT
DOMAIN,mask.icloud.com,PROXY
DOMAIN,mask-h2.icloud.com,PROXY
DOMAIN,mask-api.icloud.com,PROXY
RULE-SET,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/icloud.list,DIRECT
DOMAIN-SUFFIX,apple-dns.net,DIRECT
DOMAIN-SUFFIX,icloud.apple.com,DIRECT
DOMAIN-SUFFIX,apple-cloudkit.com,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/cdn.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,PROXY
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,DIRECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/download.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/download.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,PROXY,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/stream.conf,PROXY
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT
RULE-SET,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/classical/cn.list,DIRECT
FINAL,PROXY
